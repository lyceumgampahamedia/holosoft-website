name: Deploy Holosoft to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Resolve deployment URLs
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          DEFAULT_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          echo "VITE_API_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "VITE_WEBSITE_URL=${WEBSITE_URL:-$DEFAULT_SITE}" >> "$GITHUB_ENV"

      - name: Verify API URL
        shell: bash
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "Repository variable API_URL is required before Pages can deploy." >&2
            exit 1
          fi

      - name: Build website and CMS
        run: npm run build

      - name: Generate SEO artifacts
        run: node scripts/generate-seo.mjs

      - name: Assemble Pages artifact
        shell: bash
        run: |
          cp apps/website/dist/index.html apps/website/dist/404.html
          mkdir -p apps/website/dist/cms
          cp -R apps/cms/dist/. apps/website/dist/cms/
          touch apps/website/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
